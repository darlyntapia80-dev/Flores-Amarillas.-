<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MI VIDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --blue: #263bd1;
    --blue-dark: #121c6b;
    --blue-deep: #0a1147;
    --white: #f4f4f1;
    --red: #e0293f;
    --red-dark: #a91b2c;
    --yellow: #ffd23f;
    --yellow-deep: #f2a900;
    --yellow-light: #ffe98a;
    --green: #3fa25a;
    --green-dark: #256b39;
    --ink: #10143a;
  }
  @media (prefers-color-scheme: dark){ :root{ } }
  :root[data-theme="dark"]{ }
  :root[data-theme="light"]{ }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--blue-deep);
    color: var(--white);
    font-family: 'VT323', monospace;
    overflow-x: hidden;
    min-height:100vh;
    position:relative;
  }

  /* ---------- fondo de cuadrícula de píxeles ---------- */
  .pixel-bg{
    position: fixed;
    inset: 0;
    background-color: var(--blue);
    background-image:
      linear-gradient(var(--blue-dark) 1px, transparent 1px),
      linear-gradient(90deg, var(--blue-dark) 1px, transparent 1px);
    background-size: 22px 22px;
    z-index: -2;
  }
  .scanlines{
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.12) 0px,
      rgba(0,0,0,0.12) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: multiply;
  }

  .screen{
    min-height: 100vh;
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8vh 6vw;
    text-align: center;
    position: relative;
  }
  .screen.active{ display:flex; }

  .pixel-font{
    font-family: 'Press Start 2P', monospace;
    line-height: 1.7;
  }

  h1.title{
    font-size: clamp(14px, 4.4vw, 26px);
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--red-dark);
    letter-spacing: 1px;
    margin: 0 0 6vh;
  }

  /* ---------- caja de regalo pixelada ---------- */
  .gift{
    position: relative;
    width: min(46vw, 190px);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .gift:focus-visible .gift-body{ outline: 3px solid var(--yellow); outline-offset: 4px; }

  .gift-lid{
    width: 108%;
    height: 22%;
    margin-left: -4%;
    background: var(--red);
    clip-path: polygon(
      0% 30%, 8% 30%, 8% 0%, 16% 0%, 16% 30%,
      84% 30%, 84% 0%, 92% 0%, 92% 30%,
      100% 30%, 100% 100%, 0% 100%
    );
    position: relative;
    z-index: 2;
    transform-origin: bottom center;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .gift-lid::after{
    content:"";
    position:absolute; left:44%; top:-46%;
    width:12%; height:60%;
    background: var(--yellow);
  }
  .gift-body{
    width: 100%;
    height: 34vh;
    max-height: 190px;
    background: var(--red-dark);
    position: relative;
    box-shadow: inset -10px -10px 0 rgba(0,0,0,.18), inset 10px 10px 0 rgba(255,255,255,.08);
  }
  .gift-body::before{ /* franja vertical del lazo */
    content:"";
    position:absolute; left:44%; top:0; width:12%; height:100%;
    background: var(--yellow);
  }
  .gift-body::after{ /* franja horizontal del lazo */
    content:"";
    position:absolute; left:0; top:38%; width:100%; height:14%;
    background: var(--yellow);
  }
  .gift-shadow{
    width: 60%;
    height: 14px;
    margin: 10px auto 0;
    background: rgba(0,0,0,.35);
    filter: blur(2px);
  }
  .gift.opened .gift-lid{ transform: translateY(-60%) rotate(-14deg); }
  .gift.opened .gift-body{ animation: pop .35s ease-out .05s both; }
  @keyframes pop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.06,0.94); }
    100%{ transform: scale(1); }
  }
  .glow{
    position:absolute; left:50%; top:14%;
    width: 0; height: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,226,138,.95) 0%, rgba(255,226,138,0) 70%);
    transform: translate(-50%,-50%);
    opacity: 0;
    z-index: 1;
    pointer-events:none;
  }
  .gift.opened .glow{
    animation: burst .6s ease-out .15s forwards;
  }
  @keyframes burst{
    0%{ width:0; height:0; opacity:0; }
    40%{ opacity:1; }
    100%{ width: 340px; height: 340px; opacity:0; }
  }

  .hint{
    margin-top: 5vh;
    font-family:'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--yellow-light);
    animation: blink 1.4s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }

  /* ---------- pantalla del mensaje ---------- */
  .dialog{
    width: min(90vw, 560px);
    background: var(--blue-dark);
    border: 4px solid var(--white);
    box-shadow: 0 0 0 4px var(--blue-deep), 8px 8px 0 rgba(0,0,0,.3);
    padding: clamp(18px, 4vw, 34px);
    position: relative;
  }
  .dialog::before{ /* muesca pixel en la esquina, estilo caja de diálogo retro */
    content:"";
    position:absolute; left:-4px; top:-4px;
    width:14px; height:14px;
    background: var(--blue-deep);
    border-right:4px solid var(--white);
    border-bottom:4px solid var(--white);
  }
  .to-name{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(12px, 3.4vw, 18px);
    color: var(--yellow);
    margin: 0 0 18px;
  }
  .message{
    font-size: clamp(20px, 4.6vw, 27px);
    line-height: 1.5;
    color: var(--white);
    min-height: 7em;
    text-align: left;
    white-space: pre-wrap;
  }
  .caret{
    display:inline-block;
    width: .5em;
    background: var(--yellow);
    animation: blink .8s steps(1) infinite;
  }
  .continue-hint{
    margin-top: 22px;
    font-family:'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--yellow-light);
    opacity: 0;
    transition: opacity .4s;
  }
  .continue-hint.show{ opacity: 1; animation: blink 1.2s steps(1) infinite; }
  .screen#screen-message{ cursor: pointer; }

  /* ---------- pantalla del ramo ---------- */
  #screen-bouquet .pixel-bg-note{ display:none; }
  .stage{
    position: relative;
    width: min(90vw, 420px);
    height: 46vh;
    max-height: 360px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .stem{
    position: absolute;
    bottom: 0;
    width: 10px;
    background: var(--green);
    transform-origin: bottom center;
    animation: grow 1s cubic-bezier(.22,1,.36,1) forwards;
    animation-delay: var(--d, 0s);
    height: 0;
  }
  .stem.s1{ left: 50%; margin-left:-5px; --h: 42%; }
  .stem.s2{ left: 38%; --h: 34%; background: var(--green-dark); }
  .stem.s3{ left: 60%; --h: 34%; background: var(--green-dark); }
  .stem.s4{ left: 30%; --h: 24%; }
  .stem.s5{ left: 68%; --h: 24%; }
  @keyframes grow{ to{ height: var(--h); } }

  .leaf{
    position:absolute;
    width: 26px; height: 12px;
    background: var(--green);
    clip-path: polygon(0% 50%, 100% 0%, 100% 100%);
    opacity: 0;
    animation: fadeUp .5s ease-out forwards;
  }

  .lily{
    position: absolute;
    bottom: var(--y, 40%);
    left: var(--x, 50%);
    width: var(--s, 78px);
    height: var(--s, 78px);
    transform: translate(-50%, 40%) scale(0) rotate(var(--r, 0deg));
    opacity: 0;
    animation: bloom .55s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: var(--d, 1s);
  }
  @keyframes bloom{
    to{ transform: translate(-50%, 40%) scale(1) rotate(var(--r,0deg)); opacity:1; }
  }
  .petal{
    position:absolute;
    left:50%; top:50%;
    width: 46%; height: 62%;
    background: var(--yellow);
    clip-path: polygon(50% 0%, 78% 22%, 100% 60%, 68% 60%, 50% 100%, 32% 60%, 0% 60%, 22% 22%);
    transform-origin: 50% 100%;
  }
  .petal.p2{ transform: translate(-50%,-100%) rotate(72deg); }
  .petal.p3{ transform: translate(-50%,-100%) rotate(144deg); }
  .petal.p4{ transform: translate(-50%,-100%) rotate(216deg); }
  .petal.p5{ transform: translate(-50%,-100%) rotate(288deg); }
  .petal:first-child{ transform: translate(-50%,-100%) rotate(0deg); }
  .lily-center{
    position:absolute; left:50%; top:38%;
    width: 22%; height:22%;
    background: var(--yellow-deep);
    transform: translate(-50%,-50%);
    box-shadow: 0 0 0 3px var(--red) inset;
  }

  @keyframes fadeUp{ to{ opacity:1; } }

  .spark{
    position:absolute;
    width: 6px; height:6px;
    background: var(--yellow-light);
    opacity:0;
    animation: sparkle 2.4s ease-in-out infinite;
  }
  @keyframes sparkle{
    0%,100%{ opacity:0; transform: translateY(0) scale(.6); }
    50%{ opacity:1; transform: translateY(-14px) scale(1); }
  }

  .closing{
    margin-top: 5vh;
    font-family:'Press Start 2P', monospace;
    font-size: clamp(11px, 3.2vw, 15px);
    color: var(--white);
    letter-spacing: 1px;
  }
  .closing .heart{ color: var(--red); }

  .replay{
    margin-top: 4vh;
    font-family:'Press Start 2P', monospace;
    font-size: 10px;
    background: var(--red);
    color: var(--white);
    border: 3px solid var(--white);
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--blue-deep);
  }
  .replay:active{ transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--blue-deep); }

  .confetti{
    position: fixed;
    top: -20px;
    width: 8px; height: 8px;
    z-index: 5;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(180deg); opacity: .2; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="pixel-bg" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<!-- PANTALLA 1: portada / caja de regalo -->
<section id="screen-intro" class="screen active">
  <h1 class="title pixel-font">PARA KERLLY</h1>

  <button class="gift" id="giftBtn" aria-label="Abrir el regalo">
    <div class="glow" aria-hidden="true"></div>
    <div class="gift-lid"></div>
    <div class="gift-body"></div>
  </button>
  <div class="gift-shadow" aria-hidden="true"></div>

  <p class="hint pixel-font">TOCA PARA ABRIR</p>
</section>

<!-- PANTALLA 2: mensaje -->
<section id="screen-message" class="screen">
  <div class="dialog">
    <p class="to-name pixel-font">Kerlly:</p>
    <p class="message" id="messageText"></p>
    <p class="continue-hint pixel-font" id="continueHint">TOCA PARA CONTINUAR ▼</p>
  </div>
</section>

<!-- PANTALLA 3: ramo de lirios -->
<section id="screen-bouquet" class="screen">
  <h1 class="title pixel-font" style="margin-bottom:2vh;">¡FELIZ DÍA DE LAS FLORES AMARILLAS!</h1>
  <div class="stage" id="stage"></div>
  <p class="closing pixel-font">HECHO CON <span class="heart">&hearts;</span> PARA TI</p>
  <button class="replay pixel-font" id="replayBtn">VER DE NUEVO</button>
</section>

<script>
(function(){
  "use strict";

  // ============================================================
  // ✏️ EDITA AQUÍ EL MENSAJE — cambia este texto por el que quieras
  // ============================================================
  var MESSAGE = "En Guayaquil dicen que quien regala lirios amarillos entrega un amor que no se marchita. Yo no necesito una leyenda para saberlo: desde que estás en mi vida, todo tiene más color, hasta los días grises. Gracias por tu paciencia, por tu risa, por cada detalle que me haces gigante sin darte cuenta. Feliz día de las flores amarillas, mi amor. Te amo.";

  var screens = {
    intro: document.getElementById('screen-intro'),
    message: document.getElementById('screen-message'),
    bouquet: document.getElementById('screen-bouquet')
  };

  function showScreen(name){
    Object.keys(screens).forEach(function(k){
      screens[k].classList.toggle('active', k === name);
    });
  }

  // ---------- Pantalla 1: abrir regalo ----------
  var giftBtn = document.getElementById('giftBtn');
  var opened = false;
  function openGift(){
    if (opened) return;
    opened = true;
    giftBtn.classList.add('opened');
    setTimeout(function(){
      showScreen('message');
      startTypewriter();
    }, 650);
  }
  giftBtn.addEventListener('click', openGift);
  giftBtn.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); }
  });

  // ---------- Pantalla 2: máquina de escribir ----------
  var messageEl = document.getElementById('messageText');
  var continueHint = document.getElementById('continueHint');
  var typed = false;
  var typing = false;

  function startTypewriter(){
    if (typed) return;
    typing = true;
    messageEl.textContent = '';
    var caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = ' ';
    var i = 0;
    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (prefersReduced){
      messageEl.textContent = MESSAGE;
      finishTyping();
      return;
    }

    function tick(){
      if (i <= MESSAGE.length){
        messageEl.textContent = MESSAGE.slice(0, i);
        messageEl.appendChild(caret);
        i++;
        setTimeout(tick, 26);
      } else {
        finishTyping();
      }
    }
    tick();
  }

  function finishTyping(){
    typing = false;
    typed = true;
    messageEl.textContent = MESSAGE;
    continueHint.classList.add('show');
  }

  screens.message.addEventListener('click', function(){
    if (typing){
      // saltar la animación de escritura
      typed = true; typing = false;
      messageEl.textContent = MESSAGE;
      continueHint.classList.add('show');
      return;
    }
    if (typed){
      showScreen('bouquet');
      buildBouquet();
      launchConfetti();
    }
  });

  // ---------- Pantalla 3: ramo de lirios ----------
  var stage = document.getElementById('stage');
  var built = false;

  function petalSet(){
    var wrap = document.createElement('div');
    [0,1,2,3,4].forEach(function(n){
      var p = document.createElement('div');
      p.className = 'petal p' + (n+1);
      wrap.appendChild(p);
    });
    var center = document.createElement('div');
    center.className = 'lily-center';
    wrap.appendChild(center);
    return wrap;
  }

  function buildBouquet(){
    if (built) return;
    built = true;
    stage.innerHTML = '';

    var stems = [
      {cls:'s1'}, {cls:'s2'}, {cls:'s3'}, {cls:'s4'}, {cls:'s5'}
    ];
    stems.forEach(function(s, idx){
      var el = document.createElement('div');
      el.className = 'stem ' + s.cls;
      el.style.setProperty('--d', (idx * 0.12) + 's');
      stage.appendChild(el);
    });

    var lilies = [
      {x:'50%', y:'40%', s:96, r:0,   d:'0.9s'},
      {x:'34%', y:'30%', s:74, r:-18, d:'1.1s'},
      {x:'66%', y:'30%', s:74, r:18,  d:'1.25s'},
      {x:'24%', y:'18%', s:58, r:-28, d:'1.4s'},
      {x:'76%', y:'18%', s:58, r:28,  d:'1.5s'}
    ];
    lilies.forEach(function(l){
      var el = document.createElement('div');
      el.className = 'lily';
      el.style.setProperty('--x', l.x);
      el.style.setProperty('--y', l.y);
      el.style.setProperty('--s', l.s + 'px');
      el.style.setProperty('--r', l.r + 'deg');
      el.style.setProperty('--d', l.d);
      el.appendChild(petalSet());
      stage.appendChild(el);
    });

    for (var i=0; i<10; i++){
      var sp = document.createElement('div');
      sp.className = 'spark';
      sp.style.left = (14 + Math.random()*72) + '%';
      sp.style.bottom = (20 + Math.random()*55) + '%';
      sp.style.animationDelay = (Math.random()*2) + 's';
      stage.appendChild(sp);
    }
  }

  function launchConfetti(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors = ['#ffd23f', '#f4f4f1', '#e0293f'];
    for (var i=0; i<26; i++){
      (function(){
        var c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random()*100 + 'vw';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        var dur = 2.4 + Math.random()*1.8;
        c.style.animationDuration = dur + 's';
        c.style.animationDelay = (Math.random()*0.6) + 's';
        document.body.appendChild(c);
        setTimeout(function(){ c.remove(); }, (dur+1)*1000);
      })();
    }
  }

  document.getElementById('replayBtn').addEventListener('click', function(e){
    e.stopPropagation();
    opened = false; typed = false; typing = false; built = false;
    giftBtn.classList.remove('opened');
    continueHint.classList.remove('show');
    showScreen('intro');
  });

})();
</script>
</body>
</html>
